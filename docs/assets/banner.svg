<svg viewBox="0 0 960 400" xmlns="http://www.w3.org/2000/svg" font-family="'SF Mono','JetBrains Mono',Consolas,monospace">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b1120"/>
      <stop offset="100%" stop-color="#161f38"/>
    </linearGradient>
    <linearGradient id="amber" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#64748b"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="960" height="400" rx="24" fill="url(#bg)"/>
  <rect x="1" y="1" width="958" height="398" rx="23" fill="none" stroke="#293452" stroke-width="1.5"/>

  <!-- Title -->
  <text x="40" y="54" font-size="30" font-weight="700" fill="#f8fafc">claude-handoff</text>
  <text x="40" y="78" font-size="14" fill="#94a3b8">turn a messy Claude Code session into one clean handoff.md</text>

  <!-- Card 1: messy session -->
  <g>
    <rect x="40" y="112" width="250" height="188" rx="14" fill="#111a30" stroke="#293452" stroke-width="1.5"/>
    <text x="62" y="146" font-size="13" font-weight="700" fill="#cbd5e1" letter-spacing="0.5">SESSION .JSONL</text>
    <g font-size="12.5" fill="#64748b">
      <g transform="translate(62,168)">
        <circle cx="4" cy="-4" r="3.5" fill="none" stroke="#f87171" stroke-width="1.4"/>
        <line x1="1.7" y1="-6.3" x2="6.3" y2="-1.7" stroke="#f87171" stroke-width="1.4"/>
        <text x="18" y="0">tool_use / tool_result</text>
      </g>
      <g transform="translate(62,194)">
        <circle cx="4" cy="-4" r="3.5" fill="none" stroke="#f87171" stroke-width="1.4"/>
        <line x1="1.7" y1="-6.3" x2="6.3" y2="-1.7" stroke="#f87171" stroke-width="1.4"/>
        <text x="18" y="0">thinking blocks</text>
      </g>
      <g transform="translate(62,220)">
        <circle cx="4" cy="-4" r="3.5" fill="none" stroke="#f87171" stroke-width="1.4"/>
        <line x1="1.7" y1="-6.3" x2="6.3" y2="-1.7" stroke="#f87171" stroke-width="1.4"/>
        <text x="18" y="0">system-reminders</text>
      </g>
      <g transform="translate(62,246)">
        <circle cx="4" cy="-4" r="3.5" fill="none" stroke="#f87171" stroke-width="1.4"/>
        <line x1="1.7" y1="-6.3" x2="6.3" y2="-1.7" stroke="#f87171" stroke-width="1.4"/>
        <text x="18" y="0">subagent chatter</text>
      </g>
      <g transform="translate(62,272)">
        <circle cx="4" cy="-4" r="3.5" fill="none" stroke="#f87171" stroke-width="1.4"/>
        <line x1="1.7" y1="-6.3" x2="6.3" y2="-1.7" stroke="#f87171" stroke-width="1.4"/>
        <text x="18" y="0">slash-command envelopes</text>
      </g>
    </g>
  </g>

  <path d="M292 206 H333" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Card 2: claude-handoff engine -->
  <g>
    <rect x="343" y="112" width="228" height="188" rx="14" fill="#1a1408" stroke="url(#amber)" stroke-width="1.6"/>
    <text x="365" y="146" font-size="13" font-weight="700" fill="#fbbf24" letter-spacing="0.5">CLAUDE-HANDOFF</text>

    <!-- funnel icon -->
    <g transform="translate(365,162)">
      <path d="M0 0 H100 L64 40 V70 L36 60 V40 Z" fill="none" stroke="url(#amber)" stroke-width="2.5" stroke-linejoin="round"/>
    </g>

    <text x="365" y="256" font-size="12" fill="#e2c893">deterministic, zero deps</text>
    <text x="365" y="274" font-size="12" fill="#e2c893">--llm for a real summary</text>
  </g>

  <path d="M571 206 H612" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Card 3: handoff.md -->
  <g>
    <rect x="622" y="112" width="298" height="188" rx="14" fill="#0c1d16" stroke="#166534" stroke-width="1.5"/>
    <text x="644" y="146" font-size="13" font-weight="700" fill="#86efac" letter-spacing="0.5">HANDOFF.MD</text>
    <g font-size="12.5" fill="#a7f3d0">
      <g transform="translate(644,168)">
        <path d="M0 -4 L3 0 L9 -8" fill="none" stroke="#4ade80" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
        <text x="18" y="0">conversation, noise stripped</text>
      </g>
      <g transform="translate(644,194)">
        <path d="M0 -4 L3 0 L9 -8" fill="none" stroke="#4ade80" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
        <text x="18" y="0">files created / modified</text>
      </g>
      <g transform="translate(644,220)">
        <path d="M0 -4 L3 0 L9 -8" fill="none" stroke="#4ade80" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
        <text x="18" y="0">commands run</text>
      </g>
      <g transform="translate(644,246)">
        <path d="M0 -4 L3 0 L9 -8" fill="none" stroke="#4ade80" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
        <text x="18" y="0">goal / decisions / next steps</text>
      </g>
    </g>
  </g>

  <!-- paste anywhere row -->
  <path d="M771 300 V326" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="480" y="356" font-size="13" fill="#94a3b8" text-anchor="middle">paste into any model —</text>

  <g font-size="13" font-weight="600">
    <rect x="560" y="340" width="76" height="28" rx="14" fill="none" stroke="#475569" stroke-width="1.3"/>
    <text x="598" y="358" fill="#e2e8f0" text-anchor="middle">Claude</text>

    <rect x="648" y="340" width="60" height="28" rx="14" fill="none" stroke="#475569" stroke-width="1.3"/>
    <text x="678" y="358" fill="#e2e8f0" text-anchor="middle">GPT</text>

    <rect x="720" y="340" width="76" height="28" rx="14" fill="none" stroke="#475569" stroke-width="1.3"/>
    <text x="758" y="358" fill="#e2e8f0" text-anchor="middle">Gemini</text>
  </g>
</svg>
