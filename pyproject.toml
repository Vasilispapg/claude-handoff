[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "claude-handoff"
version = "0.3.0"
description = "Summarize & export a Claude Code session into one clean handoff.md for Gemini, GPT, or another Claude."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Vasilispapg" }]
requires-python = ">=3.9"
keywords = ["claude", "claude-code", "export", "handoff", "llm", "transcript"]
classifiers = [
    "Environment :: Console",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Utilities",
]

[project.urls]
Homepage = "https://github.com/Vasilispapg/claude-handoff"

[project.scripts]
claude-handoff = "claude_handoff:main"

[tool.setuptools]
py-modules = ["claude_handoff"]
